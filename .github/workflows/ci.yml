name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:20.10.7-dind
        options: --privileged --entrypoint /bin/sh
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run health assessment
        run: |
          python -m health_assessment.report_generator
      - name: Run bundle executor test
        run: |
          pytest -q tests/bundle_executor_test.py
      - name: Run example bundle (CLI)
        env:
          GEMMA_MODEL_DIR: ${{ github.workspace }}/models
        run: |
          python -m bundle_executor.executor bundles/example_bundle.json
      - name: Build Docker image
        run: |
          docker build -t bundle-executor .
      - name: Run executor in Docker (CPU fallback)
        env:
          GEMMA_MODEL_DIR: ${{ github.workspace }}/models
        run: |
          docker run --rm bundle-executor python -m bundle_executor.executor bundles/example_bundle.json
