<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Autogen Agents UI</title>
    <style>
        body {
            font-family: system-ui, Segoe UI, Roboto, Arial;
            margin: 20px
        }

        section {
            margin-bottom: 24px
        }

        pre {
            background: #f5f5f5;
            padding: 12px;
            overflow: auto
        }
    </style>
</head>

<body>
    <h1>Autogen Agents Artifacts</h1>
    <section>
        <h2>Prompt Pack</h2>
        <div id="prompt-pack">No prompt pack found.</div>
    </section>
    <section>
        <h2>Health Report</h2>
        <div id="health-report">No health report found.</div>
    </section>
    <section>
        <h2>Whitepaper Draft</h2>
        <div id="whitepaper">No whitepaper found.</div>
    </section>
    <script>
        async function fetchJson(path) {
            try {
                const r = await fetch(path);
                if (!r.ok) throw new Error('not ok')
                return await r.json();
            } catch (e) { return null }
        }
        async function load() {
            const pack = await fetchJson('../prompt_pack.json') || await fetchJson('../autogen-research-agents/prompt_pack.json')
            const health = await fetchJson('../health_report.json') || await fetchJson('../autogen-research-agents/health_report.json')
            const wp = await fetchJson('../whitepaper.json') || await fetchJson('../autogen-research-agents/whitepaper.json')
            document.getElementById('prompt-pack').innerHTML = pack ? '<pre>' + JSON.stringify(pack, null, 2) + '</pre>' : 'No prompt pack found.'
            document.getElementById('health-report').innerHTML = health ? '<pre>' + JSON.stringify(health, null, 2) + '</pre>' : 'No health report found.'
            document.getElementById('whitepaper').innerHTML = wp ? '<pre>' + JSON.stringify(wp, null, 2) + '</pre>' : 'No whitepaper found.'
        }
        load()
    </script>
</body>

</html>
