services:
  postgres:
    image: postgres:16-alpine
    container_name: weup-postgres
    ports:
      - "54329:5432"
    environment:
      POSTGRES_DB: weup_phase0_dev
      POSTGRES_USER: weup
      POSTGRES_PASSWORD: weup_local_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weup -d weup_phase0_dev"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - weup-postgres-data:/var/lib/postgresql/data

volumes:
  weup-postgres-data:
